<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Programa Trilhas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        main {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        main > img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.15rem;
            color: #2c2c2c;
            margin-bottom: 5px;
            font-weight: 600;
        }
        p {
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 30px;
        }
        div {
            width: 100%;
            margin-bottom: 12px;
        }

        div a {
            display: block;
            width: 100%;
            text-decoration: none;
        }
        button {
            width: 100%;
            padding: 13px;
            background-color: #f7f1f5;
            border: 1px solid #ebd8eb;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #444444;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
        }
        button:hover {
            background-color: #eee0ee;
            transform: translateY(-2px);
            border-color: #dcbcdb;
        }

        /* Rodapé com os links sociais */
        footer {
            width: 100%;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        footer a {
            text-decoration: none;
            color: #333333;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #6a0dad;
        }
    </style>
</head>
<body>

    <main>
        <img src="foto_perfil.jpg" alt="Foto de perfil">

        <h1>João Vinícius Moreira Conceição</h1>
        <p>Estudante da UFMA e de Desenvolvimento Front-end pelo Programa Trilhas</p>

        <div>
            <a href="#sobre"><button>Teste</button></a>
        </div>
        <div>
    <a href="projetos.html"><button>Veja meus projetos</button></a>
</div>
        <div>
    <a href="sobre.html"><button>Sobre mim</button></a>
</div>
        <footer>
            <a href="https://github.com/JoaoVinicius-14" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/jo%C3%A3ovin%C3%ADcius1404/?isSelfProfile=true" target="_blank">LinkedIn</a>
        </footer>
    </main>

</body>
</html>
